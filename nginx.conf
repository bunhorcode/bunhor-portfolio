# Loaded from /etc/nginx/conf.d/ (http context). Serves the Next.js static export.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml application/xml font/ttf;

    # NOTE: nginx drops server-level add_header when a location defines its own,
    # so security headers are included in every location instead.

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Fingerprinted build assets: cache for a year.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/security-headers.inc;
        try_files $uri =404;
    }

    # Other static files (favicon, images): cache for a day.
    location ~* \.(?:ico|svg|png|jpg|jpeg|webp|avif|gif|woff2?|txt|xml)$ {
        add_header Cache-Control "public, max-age=86400";
        include /etc/nginx/security-headers.inc;
        try_files $uri =404;
    }

    # Pages: no SPA fallback. Unknown paths return a real 404 using the exported 404.html.
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.inc;
        try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.inc;
    }
}
